# Visual check for one screen. mobile-sweep.mjs runs it once per locale with
# APP_ID and LOCALE set, inside the output folder, so screenshots land there.
# Shared steps live in subflows/, which the sweep does not run directly:
#   subflows/start.yaml         launch, (dev client) open the app, sign in, set language
#   subflows/login.yaml         seeded local login
#   subflows/set-language.yaml  switch to LOCALE in the app's own settings
appId: ${APP_ID}
---
- runFlow: subflows/start.yaml
# Prefer testID / accessibility id selectors. Without them, match visible text in
# every locale with a regex built from the locale files: "Home|الرئيسية|ہوم".
- tapOn: "Insights|رؤى|بصیرت"
- waitForAnimationToEnd
- takeScreenshot: insights-${LOCALE}-1
# For long screens, scroll and capture again.
- scroll
- takeScreenshot: insights-${LOCALE}-2

